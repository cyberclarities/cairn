## CAIRN — standalone deployment (PostgreSQL)
##
## Access: https://{SERVER_NAME}
##
## Usage:
##   cp .env.example .env && nano .env
##   docker compose up --build -d
##
## UPGRADING AN EXISTING DEPLOYMENT: the web container now runs as a non-root
## uid. A cairn_data volume created before that change is owned by root and the
## new uid cannot write to it — evidence uploads silently stop persisting. Run
## this once, before bringing the new image up:
##
##   docker compose run --rm --user root web chown -R cairn:cairn /app/data
##
## UPGRADING AN EXISTING DEPLOYMENT, database role: the web container no longer
## connects as the Postgres superuser (POSTGRES_USER). It connects as
## CAIRN_DB_USER, a role with no superuser rights that owns the CAIRN database.
## A fresh volume creates that role automatically. An existing one needs it
## created once, after setting CAIRN_DB_PASSWORD in .env:
##
##   docker compose up -d postgres
##   docker compose exec postgres sh /docker-entrypoint-initdb.d/10-cairn-app-role.sh
##   docker compose up -d --build
##
## Until that runs, the web container fails to start with an authentication
## error for the new role. That is intended: loud beats quietly staying superuser.

services:

  postgres:
    image: postgres:16-alpine
    container_name: cairn_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cairn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-cairn}
      # Read by deploy/postgres-init/10-cairn-app-role.sh to create the
      # non-superuser role the web tier connects as.
      CAIRN_DB_USER: ${CAIRN_DB_USER:-cairn_app}
      CAIRN_DB_PASSWORD: ${CAIRN_DB_PASSWORD:?CAIRN_DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    security_opt:
      - no-new-privileges:true
    # A restore replays an arbitrary-sized dump. Bound it so a bad one takes the
    # database down instead of the host.
    mem_limit: 1g
    networks:
      - cairn_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cairn} -d ${POSTGRES_DB:-cairn}"]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:alpine
    container_name: cairn_caddy
    restart: unless-stopped
    ports:
      ##- "80:80"
      - "7443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - SERVER_NAME=${SERVER_NAME:-localhost}
      - PORT=${PORT:-5002}
    # Not cap_drop: ALL — Caddy needs NET_BIND_SERVICE to bind 443.
    security_opt:
      - no-new-privileges:true
    networks:
      - cairn_net
    depends_on:
      - web

  web:
    build: .
    container_name: cairn_web
    restart: unless-stopped
    expose:
      - "${PORT:-5002}"
    env_file:
      - .env
    environment:
      - PORT=${PORT:-5002}
      # The app role, not POSTGRES_USER. A database restore executes an uploaded
      # dump with this connection's privileges; as superuser that included
      # COPY ... FROM PROGRAM, which is command execution on the database host.
      - DATABASE_URL=postgresql://${CAIRN_DB_USER:-cairn_app}:${CAIRN_DB_PASSWORD}@postgres/${POSTGRES_DB:-cairn}
    # This is the tier that parses uploads, shells out to psql, and holds the
    # CrowdStrike and Proofpoint credentials. It runs as a non-root uid (see
    # Dockerfile) on an unprivileged port and needs no capabilities at all.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The restore path decompresses an uploaded gzip and holds several copies of
    # it in memory. A cap turns "the console died mid-incident" into "the restore
    # failed" — the second one comes with a message you can act on.
    mem_limit: 2g
    volumes:
      # Uploaded evidence files and pre-restore snapshots. Without this
      # mount both live only in the container's writable layer and are gone
      # on the next `docker compose up --build` — fine for the database,
      # which lives in postgres_data, but not for evidence on disk.
      - cairn_data:/app/data
    networks:
      - cairn_net
    depends_on:
      postgres:
        condition: service_healthy

networks:
  cairn_net:
    name: cairn_net

volumes:
  caddy_data:
    name: cairn_caddy_data
  caddy_config:
    name: cairn_caddy_config
  postgres_data:
    name: cairn_postgres_data
  cairn_data:
    name: cairn_data
